<style>
  :root {
    --bg: #FFFFFF;
    --bg-alt: #F4F5F7;
    --panel: #FFFFFF;
    --panel-2: #EEF0F2;
    --line: #DDE1E6;
    --blue: #00AAFF;          /* fills, bars, borders */
    --blue-hover: #33BBFF;
    --blue-text: #0072B1;     /* blue for text, links, icons and focus rings (readable on white) */
    --on-blue: #0E1A22;
    --text: #292B2E;
    --text-muted: #5A6068;
    --error: #C62828;
    --success: #1E8E4E;
    --radius: 10px;
    --gutter: 20px;
    --max: 1120px;
    --font-head: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.6;
    overflow-x: hidden;
  }
  img { max-width: 100%; display: block; }
  a { color: var(--blue-text); }
  h1, h2, h3 {
    font-family: var(--font-head);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: 0.01em;
    margin: 0 0 0.4em;
  }
  h2 { font-size: clamp(2rem, 6vw, 2.9rem); text-transform: uppercase; }
  h3 { font-size: 1.6rem; font-weight: 600; }
  p { margin: 0 0 1em; }

  :focus-visible {
    outline: 3px solid var(--blue-text);
    outline-offset: 3px;
    border-radius: 4px;
  }

  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }
  section { padding: 64px 0; }
  .section-intro { color: var(--text-muted); max-width: 640px; font-size: 1.05rem; }
  .eyebrow-bar { width: 56px; height: 4px; background: var(--blue); margin-bottom: 18px; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 52px; padding: 0 26px;
    font-family: var(--font-body); font-weight: 700; font-size: 1.02rem;
    border-radius: var(--radius); border: 2px solid transparent;
    text-decoration: none; cursor: pointer;
    transition: background-color .15s, border-color .15s, color .15s;
  }
  .btn-primary { background: var(--blue); color: var(--on-blue); }
  .btn-primary:hover { background: var(--blue-hover); }
  .btn-secondary { background: transparent; color: var(--text); border-color: var(--text-muted); }
  .btn-secondary:hover { border-color: var(--blue-text); color: var(--blue-text); }
  .btn svg { width: 20px; height: 20px; flex: none; }

  /* Hero */
  .hero {
    position: relative;
    padding: 72px 0 64px;
    background:
      linear-gradient(115deg, transparent 62%, rgba(0,170,255,.07) 62%, rgba(0,170,255,.07) 74%, transparent 74%),
      var(--bg-alt);
    border-bottom: 1px solid var(--line);
  }
  .hero-brand {
    font-family: var(--font-head); font-weight: 600; font-size: 1.05rem;
    letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 28px;
  }
  .hero-brand span { color: var(--blue-text); }
  .hero h1 {
    font-size: clamp(2.8rem, 11vw, 5.2rem);
    text-transform: uppercase;
    max-width: 14ch;
    margin-bottom: 20px;
  }
  .hero h1 .accent { color: var(--blue-text); }
  .hero-sub { font-size: 1.15rem; color: var(--text-muted); max-width: 600px; margin-bottom: 30px; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 14px; }
  .hero-support {
    margin: 22px 0 0; font-weight: 500; color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  .hero-support::before { content: ''; width: 10px; height: 10px; background: var(--blue); border-radius: 2px; flex: none; }

  /* Brand cards */
  .brand-grid { display: grid; gap: 20px; margin-top: 32px; }
  .brand-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 28px; border-top: 4px solid var(--blue);
  }
  .brand-name { font-family: var(--font-head); font-size: 2.6rem; font-weight: 700; margin: 0; line-height: 1; }
  .brand-tagline { color: var(--blue-text); font-weight: 700; margin: 6px 0 14px; }
  .brand-fit {
    margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--line);
    color: var(--text-muted); font-size: .97rem;
  }
  .brand-fit strong { color: var(--text); display: block; }
  .brand-link { display: inline-block; margin-top: 14px; font-weight: 700; }
  .brands-footer { margin-top: 28px; color: var(--text-muted); }
  .brands-footer a { font-weight: 700; }

  /* Categories */
  .cats { background: var(--bg-alt); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .cat-grid { display: grid; gap: 18px; margin-top: 32px; grid-template-columns: 1fr; }
  .cat-tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .cat-media { aspect-ratio: 4 / 3; background: var(--panel-2); position: relative; }
  .cat-media img { width: 100%; height: 100%; object-fit: cover; }
  .cat-media.contain { background: #fff; }
  .cat-media.contain img { object-fit: contain; padding: 16px; }
  .placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 12px; gap: 4px;
    border: 2px dashed var(--line);
    color: var(--text-muted); font-size: .85rem;
    background: repeating-linear-gradient(45deg, var(--panel-2) 0 14px, var(--panel) 14px 28px);
  }
  .placeholder b { font-family: var(--font-head); font-size: 1.1rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text); }
  .placeholder code { font-size: .8rem; color: var(--blue-text); word-break: break-all; }
  .cat-body { padding: 18px 20px 22px; }
  .cat-body h3 { margin-bottom: 6px; }
  .cat-body p { color: var(--text-muted); margin: 0; font-size: .97rem; }
  .cats-closing { margin-top: 28px; color: var(--text-muted); }

  /* Why */
  .why-grid { display: grid; gap: 18px; margin-top: 32px; }
  .why-item { padding: 22px 0 0; border-top: 3px solid var(--blue); }
  .why-item h3 { font-size: 1.45rem; }
  .why-item p { color: var(--text-muted); margin: 0; }

  /* Quote */
  .quote { background: var(--bg-alt); border-top: 1px solid var(--line); }
  .quote-grid { display: grid; gap: 28px; margin-top: 28px; }
  .form-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
  .field { margin-bottom: 20px; }
  .field label, .field .label { display: block; font-weight: 700; margin-bottom: 6px; }
  .field .opt { font-weight: 400; color: var(--text-muted); }
  .field input[type=text], .field select, .field textarea {
    width: 100%; min-height: 50px; padding: 12px 14px;
    background: #fff; color: var(--text);
    border: 2px solid #8C929A; /* 3:1 against white so fields are visible */ border-radius: 8px;
    font: inherit; font-size: 16px; /* 16px stops iOS zoom-on-focus */
  }
  .field textarea { min-height: 110px; resize: vertical; }
  .field select {
    appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--blue) 50%), linear-gradient(135deg, var(--blue) 50%, transparent 50%);
    background-position: calc(100% - 22px) 50%, calc(100% - 16px) 50%;
    background-size: 6px 6px; background-repeat: no-repeat;
    padding-right: 44px;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue-text); outline: none; box-shadow: 0 0 0 3px rgba(0,170,255,.3); }
  .field.invalid input, .field.invalid select { border-color: var(--error); }
  .field-error { color: var(--error); font-size: .9rem; margin-top: 6px; display: none; }
  .field.invalid .field-error { display: block; }
  .check { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; min-height: 44px; padding: 4px 0; }
  .check input { width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--blue-text); flex: none; }
  .form-card .btn-primary { width: 100%; }
  .form-card .btn-primary[disabled] { opacity: .6; cursor: wait; }
  .form-status { margin-top: 16px; padding: 14px 16px; border-radius: 8px; display: none; }
  .form-status.show { display: block; }
  .form-status.error { background: rgba(198,40,40,.06); border: 1px solid var(--error); color: var(--text); }
  .form-status.error a { color: var(--error); font-weight: 700; }
  .form-success { text-align: center; padding: 36px 12px; }
  .form-success .tick {
    width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%;
    background: var(--blue); color: var(--on-blue); display: flex; align-items: center; justify-content: center;
  }
  .form-success .tick svg { width: 32px; height: 32px; }
  .form-success p { font-size: 1.1rem; margin: 0; }

  .contact-card { padding: 4px 0; }
  .contact-card h3 { margin-bottom: 16px; }
  .contact-list { list-style: none; margin: 0; padding: 0; }
  .contact-list li { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .contact-list li:last-child { border-bottom: 0; }
  .contact-list svg { width: 22px; height: 22px; color: var(--blue-text); flex: none; margin-top: 3px; }
  .contact-list .k { display: block; color: var(--text-muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; }
  .contact-list a { color: var(--text); font-weight: 700; text-decoration: none; overflow-wrap: anywhere; }
  .contact-list a:hover { color: var(--blue-text); }

  /* Footer */
  footer { padding: 36px 0 40px; border-top: 1px solid var(--line); color: var(--text-muted); font-size: .95rem; }
  footer .foot-name { font-family: var(--font-head); font-size: 1.4rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  footer .foot-contact { margin: 12px 0; }
  footer .foot-contact a { color: var(--text); }
  footer .back { font-weight: 700; }

  /* Sticky mobile bar */
  .sticky-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: none; gap: 10px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.97); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.06);
  }
  .sticky-bar .btn { flex: 1; min-height: 50px; padding: 0 12px; }

  @media (max-width: 719px) {
    body:not(.embedded) .sticky-bar { display: flex; }
    body:not(.embedded) { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
    .hero-actions .btn { flex: 1 1 100%; }
  }
  @media (min-width: 560px) {
    .cat-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 720px) {
    :root { --gutter: 32px; }
    section { padding: 88px 0; }
    .hero { padding: 104px 0 96px; }
    .brand-grid { grid-template-columns: 1fr 1fr; }
    .why-grid { grid-template-columns: 1fr 1fr; gap: 28px 36px; }
    .form-card { padding: 32px; }
  }
  @media (min-width: 960px) {
    .cat-grid { grid-template-columns: repeat(3, 1fr); }
    .why-grid { grid-template-columns: repeat(4, 1fr); }
    .quote-grid { grid-template-columns: 1.6fr 1fr; gap: 48px; align-items: start; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .btn { transition: none; }
  }
</style>
</head>

<header class="hero" id="top">
  <div class="wrap">
    <div class="hero-brand" data-copy="companyShort"></div>
    <h1 id="hero-headline"></h1>
    <p class="hero-sub" data-copy="hero.subhead"></p>

        <span data-copy="hero.secondaryButton"></span>
      </a>
    </div>
    <p class="hero-support js-layout-only" data-copy="hero.supportingLine"></p>
  </div>
</header>

<main>
  <section class="brands" aria-labelledby="brands-h">
    <div class="wrap">
      <div class="eyebrow-bar"></div>
      <h2 id="brands-h" data-copy="brands.heading"></h2>

      <div class="brand-grid" id="brand-grid"></div>
      <p class="brands-footer" id="brands-footer"></p>

  </section>

  <section class="cats" aria-labelledby="cats-h">
    <div class="wrap">
      <div class="eyebrow-bar"></div>

  <section class="why" aria-labelledby="why-h">

      <h2 id="why-h" data-copy="why.heading"></h2>
      <div class="why-grid" id="why-grid"></div>
    </div>
  </section>

  <section class="quote" id="quote" aria-labelledby="quote-h">
    <div class="wrap">
      <div class="eyebrow-bar"></div>
      <h2 id="quote-h" data-copy="form.heading"></h2>
      <p class="section-intro">
        <span data-copy="form.subheading"></span>
        <span class="js-layout-only" data-copy="form.subheadingLayout"></span>
      </p>

      <div class="quote-grid">
        <div class="form-card" id="form-card">
          <form id="quote-form" novalidate>
            <div class="field" data-field="name">
              <label for="f-name" data-copy="form.labels.name"></label>
              <input type="text" id="f-name" name="name" autocomplete="name" required aria-describedby="e-name">
              <div class="field-error" id="e-name" data-copy="form.errors.name"></div>
            </div>
            <div class="field" data-field="company">
              <label for="f-company"><span data-copy="form.labels.company"></span> <span class="opt" data-copy="form.optionalTag"></span></label>
              <input type="text" id="f-company" name="company" autocomplete="organization">
            </div>
            <div class="field" data-field="contact">
              <label for="f-contact" data-copy="form.labels.contact"></label>
              <input type="text" id="f-contact" name="contact" autocomplete="email" inputmode="email" required aria-describedby="e-contact">
              <div class="field-error" id="e-contact" data-copy="form.errors.contact"></div>
            </div>
            <div class="field" data-field="furnishing">
              <label for="f-furnishing" data-copy="form.labels.furnishing"></label>
              <select id="f-furnishing" name="furnishing" required aria-describedby="e-furnishing"></select>
              <div class="field-error" id="e-furnishing" data-copy="form.errors.furnishing"></div>
            </div>
            <div class="field" data-field="notes">
              <label for="f-notes" data-copy="form.labels.notes"></label>
              <textarea id="f-notes" name="notes"></textarea>
            </div>
            <div class="field js-layout-only" data-field="layout">
              <label class="check">
                <input type="checkbox" id="f-layout" name="layout">
                <span data-copy="form.labels.layout"></span>
              </label>
            </div>
            <button type="submit" class="btn btn-primary" id="submit-btn" data-copy="form.submitButton"></button>
            <div class="form-status error" id="form-error" role="alert"></div>
          </form>
          <div class="form-success" id="form-success" hidden tabindex="-1">
            <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
            <p data-copy="form.successMessage"></p>
          </div>
        </div>

        <aside class="contact-card" aria-labelledby="contact-h">
          <h3 id="contact-h" data-copy="form.contactHeading"></h3>
          <ul class="contact-list" id="contact-list"></ul>
        </aside>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="foot-name" data-copy="company"></div>
    <div data-copy="footer.line"></div>
    <div class="foot-contact" id="foot-contact"></div>
    <a class="back" id="back-link" target="_top"></a>
  </div>
</footer>

<nav class="sticky-bar" aria-label="Quick actions">
  <a class="btn btn-secondary js-call" href="#" target="_top" data-copy="sticky.call"></a>
  <a class="btn btn-primary js-quote" href="#quote" data-copy="sticky.quote"></a>
</nav>

    successMessage: 'Thanks! We received your request and will be in touch soon.',
    // {PHONE} and {EMAIL} are filled in from the contact info above
    errorMessage: 'Something went wrong sending your request. Please call us at {PHONE} or email {EMAIL} and we\'ll take care of you.',
    contactHeading: 'Prefer to talk?',
  },

  sticky: { call: 'Call', quote: 'Request a quote' },

  footer: { line: 'Central Office Service & Supply, serving Kansas businesses.' },
};

/* =====================================================================
   App code
   ===================================================================== */
(function () {
  const embedded = window.parent !== window;
  if (embedded) document.body.classList.add('embedded');

  const get = (path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), CONFIG);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const telHref = 'tel:' + CONFIG.phone.tel;
  const mailHref = 'mailto:' + CONFIG.email;

  // Simple copy bindings (config strings may contain trusted HTML)
  document.querySelectorAll('[data-copy]').forEach((el) => {
    const v = get(el.dataset.copy);
    if (v != null) el.innerHTML = v;
  });
  document.getElementById('hero-headline').innerHTML = CONFIG.hero.headline;

  if (!CONFIG.OFFER_LAYOUT_CONSULT) {
    document.querySelectorAll('.js-layout-only').forEach((el) => el.remove());
  }

  // Brand cards
  document.getElementById('brand-grid').innerHTML = CONFIG.brands.list.map((b) => `
    <article class="brand-card">
      <h3 class="brand-name">${esc(b.name)}</h3>
      <p class="brand-tagline">${esc(b.tagline)}</p>
      <p>${esc(b.blurb)}</p>
      <p class="brand-fit"><strong>${esc(CONFIG.brands.fitLabel)}</strong>${esc(b.goodFitFor)}</p>
      ${b.link ? `<a class="brand-link" href="${esc(b.link)}" target="_blank" rel="noopener">${esc(CONFIG.brands.linkLabel)} &rarr;</a>` : ''}
    </article>`).join('');
  document.getElementById('brands-footer').innerHTML = CONFIG.brands.footerLine;

  // Category tiles — fall back to a labeled placeholder when the image is missing
  const placeholder = (c) => `<div class="placeholder"><b>Placeholder image</b>${esc(c.name)}<code>${esc(c.image || 'no image set')}</code></div>`;
  const catGrid = document.getElementById('cat-grid');
  catGrid.innerHTML = CONFIG.categories.list.map((c, i) => `
    <article class="cat-tile">
      <div class="cat-media${c.fit === 'contain' ? ' contain' : ''}" data-i="${i}">
        ${c.image ? `<img src="${esc(c.image)}" alt="${esc(c.name)}" loading="lazy" width="800" height="600">` : placeholder(c)}
      </div>
      <div class="cat-body">
        <h3>${esc(c.name)}</h3>
        <p>${esc(c.desc)}</p>
      </div>
    </article>`).join('');
  catGrid.querySelectorAll('.cat-media img').forEach((img) => {
    const swap = () => { img.parentElement.innerHTML = placeholder(CONFIG.categories.list[img.parentElement.dataset.i]); };
    if (img.complete && img.naturalWidth === 0) swap();
    else img.addEventListener('error', swap);
  });

  // Why COSS
  document.getElementById('why-grid').innerHTML = CONFIG.why.points.map((p) => `
    <div class="why-item"><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p></div>`).join('');

  // Contact info
  const icon = {
    phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
    mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/>',
    pin: '<path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  };
  const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">${icon[k]}</svg>`;
  document.getElementById('contact-list').innerHTML = `
    <li>${svg('phone')}<div><span class="k">Phone</span><a href="${telHref}" target="_top">${esc(CONFIG.phone.display)}</a></div></li>
    <li>${svg('mail')}<div><span class="k">Email</span><a href="${mailHref}" target="_top">${esc(CONFIG.email)}</a></div></li>
    <li>${svg('pin')}<div><span class="k">Address</span>${esc(CONFIG.address)}</div></li>
    <li>${svg('clock')}<div><span class="k">Hours</span>${esc(CONFIG.hours)}</div></li>`;

  document.getElementById('foot-contact').innerHTML =
    `<a href="${telHref}" target="_top">${esc(CONFIG.phone.display)}</a> &middot; ` +
    `<a href="${mailHref}" target="_top">${esc(CONFIG.email)}</a><br>${esc(CONFIG.address)}`;
  const back = document.getElementById('back-link');
  back.href = CONFIG.mainSiteUrl;
  back.textContent = CONFIG.mainSiteLabel + ' →';

  // Call buttons
  document.querySelectorAll('.js-call').forEach((a) => { a.href = telHref; });

  // Quote buttons: smooth-scroll to form and focus the first field
  const form = document.getElementById('quote-form');
  document.addEventListener('click', (e) => {
    const a = e.target.closest('.js-quote');
    if (!a) return;
    e.preventDefault();
    const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.getElementById('quote').scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
    const first = document.getElementById('f-name');
    if (first && !form.hidden) first.focus({ preventScroll: true });
  });

  // Furnishing dropdown
  const sel = document.getElementById('f-furnishing');
  sel.innerHTML = `<option value="">${esc(CONFIG.form.furnishingPlaceholder)}</option>` +
    CONFIG.form.furnishingOptions.map((o) => `<option>${esc(o)}</option>`).join('');

  // Flyer tracking: ?src=flyer-oct
  const src = (new URLSearchParams(location.search).get('src') || '').replace(/[^\w\-.]/g, '').slice(0, 60);

  // Validation
  const isEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  const isPhone = (v) => /^[\d\s()+.\-]+$/.test(v) && v.replace(/\D/g, '').length >= 10;
  const rules = {
    name: (v) => v.trim().length > 0,
    contact: (v) => isEmail(v.trim()) || isPhone(v.trim()),
    furnishing: (v) => v !== '',
  };
  const setInvalid = (name, bad) => {
    const field = form.querySelector(`[data-field="${name}"]`);
    field.classList.toggle('invalid', bad);
    field.querySelector('input, select').setAttribute('aria-invalid', bad ? 'true' : 'false');
  };
  Object.keys(rules).forEach((name) => {
    const el = form.elements[name];
    const evt = el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(evt, () => {
      if (el.closest('.field').classList.contains('invalid')) setInvalid(name, !rules[name](el.value));
    });
    el.addEventListener('blur', () => { if (el.value) setInvalid(name, !rules[name](el.value)); });
  });

  // Lead email, built here like the copier wizard's so the EmailJS editor can't rewrite the layout.
  // The EmailJS template's content is just {{{message_html}}}. All visitor input is escaped.
  function buildEmailHtml(p) {
    const row = (label, value) =>
      `<tr><td style="padding:6px 0;font-family:Arial,sans-serif;font-size:13px;color:#888888;width:38%;vertical-align:top;">${label}</td>` +
      `<td style="padding:6px 0;font-family:Arial,sans-serif;font-size:13px;color:#333333;font-weight:bold;">${esc(value).replace(/\n/g, '<br>')}</td></tr>`;
    const meta = (label, value) =>
      `<span style="font-weight:bold;color:#292B2E;text-transform:uppercase;">${label}:</span> ${esc(value)}`;
    return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background-color:#F1F5F9;font-family:Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F1F5F9">
<tr><td align="center" style="padding:24px 16px;">
<table width="600" cellpadding="0" cellspacing="0" border="0">
<tr><td bgcolor="#292B2E" style="border-radius:8px 8px 0 0;">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
<tr><td style="padding:28px 32px 22px 32px;">
<p style="margin:0 0 4px 0;font-family:Arial,sans-serif;font-size:11px;color:#00AAFF;text-transform:uppercase;letter-spacing:1px;font-weight:bold;">COSS Office Furniture</p>
<p style="margin:0 0 4px 0;font-family:Arial,sans-serif;font-size:22px;font-weight:bold;color:#ffffff;">New Quote Request</p>
<p style="margin:0;font-family:Arial,sans-serif;font-size:13px;color:#B9BEC5;">From the furniture landing page</p>
</td></tr>
<tr><td bgcolor="#00AAFF" style="height:4px;font-size:0;line-height:0;">&nbsp;</td></tr>
</table>
</td></tr>
<tr><td bgcolor="#ffffff" style="padding:32px;">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
<tr><td style="padding:0 0 6px 0;font-family:Arial,sans-serif;font-size:11px;font-weight:bold;color:#888888;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid #EBEBEB;">Customer Details</td></tr>
<tr><td style="padding:0 0 24px 0;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F4F6FA">
<tr><td style="padding:20px 24px;">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
${row('Name', p.name)}
${row('Company', p.company)}
${row('Phone / Email', p.contact)}
${row('Furnishing', p.furnishing)}
${row('Layout Help', p.layout_help)}
${row('Notes', p.notes)}
</table>
</td></tr>
</table>
</td></tr>
<tr><td>
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #D0D8E8;border-left:4px solid #00AAFF;">
<tr><td style="padding:16px 24px;font-family:Arial,sans-serif;font-size:12px;color:#666666;line-height:1.7;">
${meta('Flyer source', p.src)}<br>
${meta('Submitted', p.submitted_at)}<br>
${meta('Page', p.page_url)}
</td></tr>
</table>
</td></tr>
</table>
</td></tr>
<tr><td bgcolor="#F1F5F9" style="padding:20px 32px;text-align:center;">
<p style="margin:0 0 4px 0;font-family:Arial,sans-serif;font-size:12px;font-weight:bold;color:#666666;">Central Office Service &amp; Supply</p>
<p style="margin:0;font-family:Arial,sans-serif;font-size:11px;color:#aaaaaa;">Sent automatically by the office furniture quote form.</p>
</td></tr>
</table>
</td></tr>
</table>
</body></html>`;
  }

  const errBox = document.getElementById('form-error');
  const btn = document.getElementById('submit-btn');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    errBox.classList.remove('show');

    let firstBad = null;
    Object.keys(rules).forEach((name) => {
      const bad = !rules[name](form.elements[name].value);
      setInvalid(name, bad);
      if (bad && !firstBad) firstBad = form.elements[name];
    });
    if (firstBad) { firstBad.focus(); return; }

    const contact = form.elements.contact.value.trim();
    const params = {
      name: form.elements.name.value.trim(),
      company: form.elements.company.value.trim() || '(not provided)',
      contact: contact,
      reply_to: isEmail(contact) ? contact : '',
      furnishing: form.elements.furnishing.value,
      notes: form.elements.notes.value.trim() || '(none)',
      layout_help: CONFIG.OFFER_LAYOUT_CONSULT ? (form.elements.layout.checked ? 'Yes' : 'No') : 'N/A',
      src: src || '(none)',
      page_url: location.href,
      submitted_at: new Date().toLocaleString('en-US', { timeZone: 'America/Chicago' }) + ' CT',
    };
    params.message_html = buildEmailHtml(params);

    btn.disabled = true;
    btn.textContent = CONFIG.form.sendingButton;

    const send = () => {
      if (typeof emailjs === 'undefined') return Promise.reject(new Error('EmailJS failed to load'));
      return emailjs.send(CONFIG.EMAILJS_SERVICE_ID, CONFIG.EMAILJS_TEMPLATE_ID, params, { publicKey: CONFIG.EMAILJS_PUBLIC_KEY });
    };

    send().then(() => {
      form.hidden = true;
      const ok = document.getElementById('form-success');
      ok.hidden = false;
      ok.focus({ preventScroll: true });
      ok.scrollIntoView({ block: 'center' });
    }).catch((err) => {
      console.error('EmailJS error:', err);
      errBox.innerHTML = CONFIG.form.errorMessage
        .replace('{PHONE}', `<a href="${telHref}" target="_top">${esc(CONFIG.phone.display)}</a>`)
        .replace('{EMAIL}', `<a href="${mailHref}" target="_top">${esc(CONFIG.email)}</a>`);
      errBox.classList.add('show');
      btn.disabled = false;
      btn.textContent = CONFIG.form.submitButton;
    });
  });

  // Report height to a parent iframe host (no-op when opened standalone), same pattern as the copier wizard
  if (embedded) {
    let last = 0;
    const postHeight = () => {
      // Measure the body, not documentElement.scrollHeight, which never drops below the iframe's current height
      const h = Math.ceil(document.body.getBoundingClientRect().height);
      if (h && h !== last) {
        last = h;
        window.parent.postMessage({ type: 'furniture-page-height', height: h }, '*');
      }
    };
    window.addEventListener('load', postHeight);
    window.addEventListener('resize', postHeight);
    if ('ResizeObserver' in window) new ResizeObserver(postHeight).observe(document.body);
  }
})();
</script>
</body>
</html>
